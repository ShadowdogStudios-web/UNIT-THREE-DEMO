<script>var D={"chapter6.html": {"title": "Chapter 6: Strikes and Solidarity", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. The cover image is the Harper's Weekly engraving of the Haymarket bomb. Ask what it shows before you explain it.", "ask": "This picture was published days after the event. Was the artist there? How might it shape what readers believed?", "ans": "Probably not there; it makes the workers look violent and dangerous, so readers would blame them.", "watch": "Students treat the engraving as a photo of what happened.", "move": "That question IS the hook in the lesson plan. Quick-write two sentences, then pair share.", "title": "Strikes and Solidarity"}, {"t": 3, "say": "Read the Haymarket opening. Stop after 'No one ever proved who threw the bomb.' Let it sit.", "ask": "If no one proved who threw the bomb, why were eight men convicted?", "ans": "For their beliefs and speeches — the city wanted someone punished.", "watch": "Students assume conviction means guilt.", "move": "Write PROVEN | NOT PROVEN | OPINION on the board. You'll use it for the assignment.", "title": "Opening"}, {"t": 2, "say": "A war over the most basic promise: hard work earns a fair share. Illinois was its bloodiest battlefield.", "ask": "What did workers want? List three things.", "ans": "Higher wages, shorter hours (eight-hour day), safe conditions.", "watch": "Students think strikes were about greed.", "move": "Students highlight the 'practice' details: poverty wages, eighty-hour weeks.", "title": "Opening"}, {"t": 3, "say": "'Imagine yourself as a worker.' Read it as a scenario. Then: one worker alone has no power.", "ask": "If you complain alone, what happens? If everyone stops working together?", "ans": "Alone, you're fired and replaced. Together, the factory stops and the owner has to listen.", "watch": "Students don't understand why unions mattered.", "move": "Quick demo: one student 'quits' and is replaced; the whole row quits and nothing gets made.", "title": "Why workers organized"}, {"t": 3, "say": "The great battles: 1877 Railroad Strike, Haymarket 1886, Homestead 1892, Pullman 1894. Each time, troops or courts sided with owners.", "ask": "What pattern do you see in how these strikes ended?", "ans": "The government sent troops or courts ordered workers back; workers usually lost.", "watch": "Four strikes blur together.", "move": "Quick timeline on the board with four dates; students copy it into My Notes.", "title": "The great battles"}, {"t": 2, "say": "Knights of Labor (everyone welcome, faded after Haymarket) vs. AFL (skilled workers only, modest goals, survived).", "ask": "Why did the bigger, more open union fade and the narrower one survive?", "ans": "Knights were blamed for Haymarket; AFL avoided radicals and asked for practical things.", "watch": "This is a quiz question (Knights vs. AFL). Make sure the difference is clear.", "move": "T-chart: Knights | AFL — who could join, goals, what happened.", "title": "The great battles"}, {"t": 5, "say": "Be the Historian: Who threw the bomb? This is the assignment's skill. Model one statement: 'A bomb was thrown — proven. The defendants planned it — not proven.'", "ask": "Is 'the anarchists' speeches caused the bomb' proven, not proven, or opinion?", "ans": "Not proven or opinion — no evidence linked any speaker to the bomb.", "watch": "Students confuse 'not proven' with 'false.' Not proven means the evidence doesn't reach that far.", "move": "Guided practice from the lesson plan: try item 1 with a partner, check together, then release.", "title": "Be the Historian: Who Threw the Bomb?"}, {"t": 2, "say": "Illinois Lens: Illinois was the cockpit of American labor — Haymarket and Pullman both happened here.", "ask": "Why would Chicago be the center of labor battles?", "ans": "Railroads, factories, stockyards — the most workers and the most industry.", "watch": "Time.", "move": "Keep it to two minutes.", "title": "Illinois: the cockpit of American labor"}, {"t": 3, "say": "Pullman 1894: wages cut, rents not. Debs's union joined; federal troops ended it; Debs went to jail and came out a socialist.", "ask": "The government said it sent troops to protect the mail. Was that the real reason?", "ans": "It was the legal reason; the real effect was breaking the strike for the railroad companies.", "watch": "Connects to Chapter 2's Pullman slides — students may remember the 'model town.'", "move": "Ask: 'Where have we seen Pullman before?' Let them make the link.", "title": "Illinois: the cockpit of American labor"}, {"t": 4, "say": "Why was American labor weaker than Europe's? Diversity used to divide workers, belief in the American Dream, force, the AFL's narrow focus.", "ask": "How does setting workers against each other by race or nationality help employers?", "ans": "Divided workers can't strike together; owners can bring in one group to replace another.", "watch": "This is abstract. Use a concrete example: strikebreakers.", "move": "Honors: rank the four reasons and defend #1.", "title": "Be the Historian: Why Was American Labor Weaker?"}, {"t": 2, "say": "In the short run, workers lost. Strikes broken, unions crushed.", "ask": "If they lost, why study them?", "ans": "Because they changed ideas and set up later wins — the next slide shows it.", "watch": "Students conclude it was pointless.", "move": "Bridge straight to the next slide.", "title": "The Big Picture"}, {"t": 2, "say": "'And yet.' Solidarity couldn't be unlearned; the eight-hour day eventually became law. May Day is still celebrated worldwide.", "ask": "Back to the driving question: why did workers fight back, and why did they lose?", "ans": "They fought because conditions were deadly and wages too low; they lost because owners had troops, courts, and money on their side.", "watch": "Protect the time for this. It's the exit ticket.", "move": "Cold-call two students for an evidence answer, then exit ticket.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat. Solidarity is the big idea word.", "ask": "What's the root of 'solidarity'?", "ans": "Solid — standing together firmly.", "watch": "Students confuse Haymarket and Pullman on the quiz.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "haymarket/index.html": {"title": "The Haymarket Affair", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Haymarket, May 1886 — the same event as Chapter 6, in depth.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "The Haymarket Affair"}, {"t": 1, "say": "Three ideas to follow. Have students copy the three words into My Notes as headings.", "ask": "", "ans": "", "watch": "", "move": "These three headings become their notes for the whole deep dive.", "title": "Three ideas to follow"}, {"t": 2, "say": "Separate what can be proven from what people believed. This is the PROVEN | NOT PROVEN | OPINION skill from Chapter 6.", "ask": "What question is this deep dive asking you to answer?", "ans": "Restate the question in their own words.", "watch": "Students skip the framing slide.", "move": "Point out the skill: this is what they'll be graded on in the claim.", "title": "“Who threw the bomb?”"}, {"t": 3, "say": "The eight-hour day: 'eight hours for work, eight for rest, eight for what we will.'", "ask": "Why was an eight-hour day such a big demand?", "ans": "Workers worked 10–14 hours; it meant time for family, rest, and life.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The eight-hour day"}, {"t": 3, "say": "The bomb: a small, peaceful rally; the mayor watched and went home; police marched in; someone threw a bomb.", "ask": "What detail suggests the rally was peaceful?", "ans": "The mayor watched and left; it was winding down in the rain.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The bomb"}, {"t": 3, "say": "The trial: the prosecution admitted it couldn't prove who threw the bomb, and argued the speeches caused it.", "ask": "What were the men really convicted for?", "ans": "Their words and beliefs, not the act.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The trial"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: how far does the evidence reach?", "ask": "Who threw the bomb?", "ans": "Unknown — the evidence doesn't reach any defendant.", "watch": "Students name a defendant as the bomber.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Who threw the bomb?"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: crime or idea?", "ask": "Were the men tried for a crime or for their ideas?", "ans": "For their ideas, with evidence (no link to the bomb; Altgeld's 1893 pardon).", "watch": "Students accept 'they called for violence' as proof of the act.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Crime, or idea?"}, {"t": 8, "say": "Build a Deeper Claim: claim, evidence, reasoning, counter-claim. Model a weak claim and fix it out loud before releasing: 'The Haymarket trial was bad' → 'The Haymarket trial showed ___, because ___.'", "ask": "Is your claim something a reasonable person could disagree with?", "ans": "A claim that takes a side and can be argued, backed by evidence from the slides.", "watch": "Claims that are just facts ('The fair was in 1893'). A fact can't be argued.", "move": "Honors must complete the counter-claim box. Others: claim + one piece of evidence is the minimum.", "title": "What does Haymarket prove?"}, {"t": 1, "say": "Go deeper. Students who finish early can open another deep dive or a film.", "ask": "", "ans": "", "watch": "Students leave without saving. Work autosaves, but remind them to Download my work if they switch devices.", "move": "", "title": "Go deeper"}]}, "joplin/index.html": {"title": "Ragtime: Scott Joplin", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Scott Joplin and ragtime. Have headphones ready.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "Ragtime: Scott Joplin"}, {"t": 3, "say": "Born around 1868 in northeast Texas into a family that included formerly enslaved people.", "ask": "What did Joplin have to overcome to become a musician?", "ans": "Poverty, racism, little access to formal training.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A pianist from the borderlands"}, {"t": 3, "say": "Sedalia, Missouri: a railroad town with music.", "ask": "Why would a railroad town have music?", "ans": "Workers with paychecks, clubs, travelers.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A railroad town with music in it"}, {"t": 3, "say": "What makes ragtime: steady left hand, syncopated right hand.", "ask": "Tap the beat on your desk while the music plays — where does the melody land?", "ans": "Just off the beat — that's syncopation.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "What makes it ragtime?"}, {"t": 6, "say": "Listening slide. Play the Maple Leaf Rag (1916 piano roll, played by Joplin himself). Students listen once just to enjoy, then again with the question.", "ask": "What do you notice about the rhythm?", "ans": "Bouncy, off-beat melody over a steady beat.", "watch": "Audio needs headphones or the room speaker. Test it before class.", "move": "Have students tap the left-hand beat.", "title": "Four rags by Scott Joplin"}, {"t": 3, "say": "Selling music by the page: sheet music was the product before records and radio.", "ask": "Why did publishers put bright covers on sheet music?", "ans": "To sell it — covers were advertising.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Selling music by the page"}, {"t": 3, "say": "'Never right to play ragtime fast' — Joplin's School of Ragtime, 1908.", "ask": "Why did Joplin want ragtime taken seriously?", "ans": "He saw it as serious music, not cheap noise.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "“Never right to play ragtime fast”"}, {"t": 3, "say": "From Missouri to the world, through railroads and the 1893 fair.", "ask": "How did ragtime spread?", "ans": "Railroads, sheet music, touring pianists, the World's Fair.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "From Missouri to the world"}, {"t": 3, "say": "St. Louis and 'The Cascades,' written for the 1904 World's Fair.", "ask": "What does writing music for a World's Fair tell you about Joplin's ambitions?", "ans": "He wanted a big, public, respected audience.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A home on Delmar, and “The Cascades”"}, {"t": 3, "say": "Treemonisha: an opera he couldn't get staged.", "ask": "Why couldn't a famous composer get his opera performed?", "ans": "Racism; Black composers weren't taken seriously in 'high' music.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "An opera called Treemonisha"}, {"t": 3, "say": "A late encore: rediscovered in the 1970s; Pulitzer Prize in 1976.", "ask": "Why might it take 60 years to honor him?", "ans": "The country's attitudes toward Black artists changed slowly.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A late encore"}, {"t": 5, "say": "Why did it take so long? Connect to Chapter 10's nadir.", "ask": "How does Joplin's life connect to what we learned about the nadir?", "ans": "Jim Crow limited what Black artists were allowed to do and be credited for.", "watch": "Students miss the connection to Chapter 10.", "move": "Sentence starter on the slide.", "title": "Why did it take so long?"}, {"t": 1, "say": "Your assignment: Listen Like a Historian. It opens on its own page.", "ask": "", "ans": "", "watch": "", "move": "", "title": "Your assignment"}]}};var cur={page:null,slide:0},t0=Date.now();
